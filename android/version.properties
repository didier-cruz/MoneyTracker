# Fuente de verdad de versionCode/versionName para los tres flavors
# (dev/qa/prod comparten un unico contador — ver razonamiento en
# scripts/bump-version.js). Leido por android/app/build.gradle en cada
# build y escrito por `yarn build:*` antes de compilar.
#
# ARRANCA EN 1 / 1.0.0 porque la app NUNCA se ha publicado: se comprobo
# que play.google.com no sirve ficha para com.melo.moneytracker. Ese
# reseteo solo era posible antes de la primera subida.
#
# A partir de la primera publicacion, VERSION_CODE NO PUEDE BAJAR NUNCA.
# Play rechaza un valor <= al ya subido y no hay forma de deshacerlo:
# un numero quemado por error se queda quemado. No lo edites a mano
# hacia abajo ni resuelvas un conflicto de merge escogiendo el menor.
VERSION_CODE=3
VERSION_NAME=1.0.0
