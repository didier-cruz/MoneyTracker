apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
project.ext.vectoricons = [
    iconFontNames: [ 
        'MaterialCommunityIcons.ttf', 
        'FontAwesome5.ttf', 
        'FontAwesome.ttf'
    ] // Name of the font files you want to copy
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.moneytracker"
    defaultConfig {
        applicationId "com.moneytracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Clave de RELEASE. Ni el fichero ni las contrasenas viven en el
        // repositorio: salen de `MONEYTRACKER_UPLOAD_*` en el
        // `~/.gradle/gradle.properties` de cada maquina que firme.
        //
        // El `if` no es cosmetico: sin el, cualquiera que clone el repo
        // sin esas propiedades no podria ni compilar en debug, porque
        // Gradle evalua este bloque siempre. Con el, quien no las tenga
        // simplemente no puede firmar release, que es justo lo que se
        // busca.
        if (project.hasProperty('MONEYTRACKER_UPLOAD_STORE_FILE')) {
            release {
                storeFile file(MONEYTRACKER_UPLOAD_STORE_FILE)
                storePassword MONEYTRACKER_UPLOAD_STORE_PASSWORD
                keyAlias MONEYTRACKER_UPLOAD_KEY_ALIAS
                keyPassword MONEYTRACKER_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Firmaba con `signingConfigs.debug`, es decir con
            // `android/app/debug.keystore`: un fichero VERSIONADO en este
            // mismo repositorio y cuya contrasena es la publica de React
            // Native ('android'). Cualquiera con acceso al codigo podia
            // firmar una "actualizacion" que Android instalaba encima de
            // la del usuario como si fuera legitima, y Play Console
            // rechaza de plano un APK firmado asi.
            //
            // Si la maquina no tiene las propiedades de firma, se cae de
            // vuelta a debug PERO el APK resultante no es distribuible.
            // Se prefiere eso a romper el build de quien solo quiera
            // compilar; `assembleRelease` avisa mas abajo.
            signingConfig project.hasProperty('MONEYTRACKER_UPLOAD_STORE_FILE')
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * `react-native-vector-icons/fonts.gradle` (aplicado arriba) crea la
 * tarea `copyReactNativeVectorIconFonts`, que escribe en
 * `build/intermediates/ReactNativeVectorIcons/fonts`. Las tareas de
 * lintVital LEEN ese mismo directorio, pero nadie declara esa relacion.
 *
 * Gradle 8.10 dejo de tolerarlo: valida las dependencias implicitas
 * entre tareas y aborta el build con "uses this output of task ... without
 * declaring an explicit or implicit dependency". Rompia
 * `assembleRelease` entero — no es un aviso, es un fallo.
 *
 * Se declara el orden con `mustRunAfter`, que es una de las tres
 * soluciones que propone el propio mensaje de Gradle. La alternativa que
 * circula por ahi es apagar lintVital con `checkReleaseBuilds false`,
 * y se descarta: eso no arregla la relacion entre tareas, solo silencia
 * al unico que la estaba detectando, y de paso renuncia a los avisos de
 * lint que si importan en un build de release.
 */
project.afterEvaluate {
    def copyFonts = tasks.findByName('copyReactNativeVectorIconFonts')
    if (copyFonts != null) {
        tasks.matching { it.name.startsWith('lintVital') || it.name.contains('LintVitalReportModel') }
             .configureEach { mustRunAfter copyFonts }
    }
}
